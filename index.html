<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
    --text: #f5f5f5;
    --text-dim: rgba(245,245,245,0.65);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:var(--text);
    overflow:hidden;
  }

  /* ---------- INTRO SCREEN ---------- */
  #intro{
    position:fixed; inset:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    z-index:1000;
    cursor:pointer;
    transition:opacity .8s ease, visibility .8s;
  }
  #intro span{
    font-size:clamp(22px,3.5vw,34px);
    font-weight:500;
    letter-spacing:.5px;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }
  #intro.hidden{opacity:0; visibility:hidden; pointer-events:none;}

  /* ---------- VIDEO BACKGROUND ---------- */
  #video-bg{
    position:fixed; inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  #video-bg iframe{
    position:absolute;
    top:50%; left:50%;
    /* cover trick: oversize the iframe so no black bars */
    width:max(100vw, 177.78vh);
    height:max(100vh, 56.25vw);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  #video-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:1;
    pointer-events:none;
  }

  /* ---------- MAIN CONTENT ---------- */
  #main{
    position:relative;
    z-index:2;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition:opacity 1.2s ease .3s;
  }
  #main.show{opacity:1;}

  .card{
    width:min(430px, 90vw);
    padding:48px 36px 28px;
    border-radius:24px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    text-align:center;
    position:relative;
    animation:cardIn 1s ease .4s both;
  }
  @keyframes cardIn{
    from{transform:translateY(24px); opacity:0;}
    to{transform:translateY(0); opacity:1;}
  }

  .avatar-wrap{
    position:relative;
    width:120px; height:120px;
    margin:0 auto 18px;
  }
  .avatar{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.25);
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    display:block;
  }
  .avatar-emoji{
    position:absolute;
    top:-14px; left:-10px;
    font-size:34px;
    transform:rotate(-15deg);
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
  }

  .username{
    font-size:30px;
    font-weight:700;
    letter-spacing:.5px;
    text-shadow:0 0 14px rgba(255,255,255,.55), 0 0 40px rgba(160,160,255,.35);
    animation:glow 3s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{text-shadow:0 0 12px rgba(255,255,255,.45), 0 0 36px rgba(160,160,255,.25);}
    50%{text-shadow:0 0 20px rgba(255,255,255,.8), 0 0 55px rgba(160,160,255,.5);}
  }

  .location{
    margin-top:10px;
    font-size:14px;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }

  /* --- link card --- */
  .link-card{
    margin:26px auto 0;
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    border-radius:18px;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.10);
    text-decoration:none;
    color:var(--text);
    transition:transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .link-card:hover{
    transform:translateY(-3px) scale(1.02);
    background:rgba(0,0,0,0.5);
    border-color:rgba(255,255,255,0.28);
  }
  .link-avatar-wrap{position:relative; flex-shrink:0;}
  .link-avatar{
    width:52px; height:52px;
    border-radius:14px;
    object-fit:cover;
    display:block;
  }
  .online-dot{
    position:absolute;
    bottom:-3px; right:-3px;
    width:14px; height:14px;
    border-radius:50%;
    background:#2ecc71;
    border:2.5px solid #101010;
  }
  .link-info{text-align:left; flex:1;}
  .link-title{
    font-size:16px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .badge{
    font-size:10px;
    padding:2px 7px;
    border-radius:6px;
    background:linear-gradient(135deg,#f7b733,#fc4a1a);
    color:#fff; font-weight:600;
    display:inline-flex; align-items:center; gap:3px;
  }
  .link-sub{
    font-size:11.5px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    margin-top:2px;
    text-transform:uppercase;
  }

  /* --- spotify --- */
  .spotify-btn{
    margin:26px auto 0;
    width:52px; height:52px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    transition:transform .25s ease, background .25s ease;
    text-decoration:none;
  }
  .spotify-btn:hover{transform:scale(1.12); background:rgba(255,255,255,0.18);}
  .spotify-btn svg{width:28px; height:28px; fill:#fff;}

  .views{
    position:absolute;
    bottom:16px; left:20px;
    display:flex; align-items:center; gap:6px;
    font-size:14px;
    color:var(--text-dim);
  }
  .views svg{width:18px; height:18px; fill:var(--text-dim);}

  /* ---------- VOLUME CONTROL (left side) ---------- */
  #volume-panel{
    position:fixed;
    left:22px; top:50%;
    transform:translateY(-50%);
    z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:18px 12px;
    border-radius:18px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:0;
    transition:opacity 1s ease .8s;
  }
  #volume-panel.show{opacity:1;}
  #mute-btn{
    background:none; border:none; cursor:pointer;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    transition:background .2s;
  }
  #mute-btn:hover{background:rgba(255,255,255,.12);}
  #mute-btn svg{width:22px; height:22px; fill:#fff;}

  #vol-slider{
    -webkit-appearance:none;
    appearance:none;
    writing-mode:vertical-lr;
    direction:rtl;
    width:6px;
    height:150px;
    background:rgba(255,255,255,.2);
    border-radius:10px;
    outline:none;
    cursor:pointer;
  }
  #vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    cursor:pointer;
  }
  #vol-slider::-moz-range-thumb{
    width:16px; height:16px;
    border:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    cursor:pointer;
  }
  #vol-label{
    font-size:11px;
    color:var(--text-dim);
    font-weight:500;
  }

  @media (max-width:600px){
    #volume-panel{left:10px; padding:14px 9px;}
    #vol-slider{height:110px;}
    .card{padding:40px 24px 24px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      <span id="view-count">8</span>
    </div>
  </div>
</div>

<script>
  // ===== CONFIG =====
  const VIDEO_ID = "JZjAg6fK-BQ";   // background গান বদলাতে চাইলে এখানে YouTube ভিডিও ID দাও
  const DEFAULT_VOLUME = 40;

  let player = null;
  let playerReady = false;
  let isMuted = false;
  let entered = false;

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    const vars = {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      loop: 1,
      playlist: VIDEO_ID,   // loop এর জন্য লাগবে
      modestbranding: 1,
      rel: 0,
      playsinline: 1
    };
    // file:// দিয়ে খুললে origin পাঠানো যাবে না, http/https হলে পাঠাও
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      vars.origin = location.origin;
    }
    player = new YT.Player('yt-player', {
      videoId: VIDEO_ID,
      playerVars: vars,
      events: {
        onReady: () => {
          playerReady = true;
          player.setVolume(DEFAULT_VOLUME);
          if (entered) {
            startPlayback();
          } else {
            // ভিজিটর ঢোকার সাথে সাথেই intro-র পেছনে ভিডিও muted চলা শুরু করবে
            player.mute();
            player.playVideo();
          }
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) player.playVideo();
        },
        onError: () => { useFallbackEmbed(); }
      }
    });
  };

  // API লোড না হলে / প্লেয়ার fail করলে সাধারণ iframe দিয়ে ভিডিও চালাও
  let fallbackUsed = false;
  function useFallbackEmbed(){
    if (fallbackUsed) return;
    fallbackUsed = true;
    playerReady = false;
    const bg = document.getElementById('video-bg');
    bg.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + VIDEO_ID +
      '?autoplay=1&mute=0&controls=0&loop=1&playlist=' + VIDEO_ID +
      '&rel=0&iv_load_policy=3&playsinline=1" frameborder="0" ' +
      'allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    // fallback-এ volume API নেই, তাই স্লাইডার লুকিয়ে দাও
    document.getElementById('volume-panel').style.display = 'none';
  }

  // enter করার ৪ সেকেন্ড পরেও player ready না হলে fallback চালাও
  function armFallbackTimer(){
    setTimeout(() => { if (!playerReady) useFallbackEmbed(); }, 4000);
  }

  function startPlayback(){
    if (!playerReady) return;
    player.unMute();
    player.setVolume(parseInt(volSlider.value, 10));
    player.playVideo();
  }

  // ===== INTRO click to enter =====
  const intro = document.getElementById('intro');
  intro.addEventListener('click', () => {
    entered = true;
    intro.classList.add('hidden');
    document.getElementById('main').classList.add('show');
    document.getElementById('volume-panel').classList.add('show');
    startPlayback();
    armFallbackTimer();
  });

  // ===== VOLUME CONTROLS =====
  const volSlider = document.getElementById('vol-slider');
  const volLabel  = document.getElementById('vol-label');
  const muteBtn   = document.getElementById('mute-btn');
  const iconSound = document.getElementById('icon-sound');
  const iconMuted = document.getElementById('icon-muted');

  volSlider.addEventListener('input', () => {
    const v = parseInt(volSlider.value, 10);
    volLabel.textContent = v + "%";
    if (playerReady){
      player.setVolume(v);
      if (v === 0){ setMuted(true); }
      else if (isMuted){ setMuted(false); }
    }
  });

  muteBtn.addEventListener('click', () => setMuted(!isMuted));

  function setMuted(m){
    isMuted = m;
    if (playerReady){
      if (m) player.mute(); else player.unMute();
    }
    iconSound.style.display = m ? "none" : "block";
    iconMuted.style.display = m ? "block" : "none";
  }
</script>
</body>
</html>
